<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de Acopio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<!-- SDK de Firebase (compat): cubre autenticación anónima y base de datos (Firestore).
     Los PDFs y notas de voz también se guardan en Firestore (como texto codificado),
     así no hace falta activar Firebase Storage ni el plan de pago. No requiere cuenta
     de quien usa la página, solo del proyecto que crea Sebastián en Firebase — ver
     FIREBASE_CONFIG más abajo. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<!-- pdf.js: lee el texto de los PDFs de OC directo en el navegador para autocompletar el
     formulario (gratis, sin backend, sin costo por documento). Si el PDF es una foto/escaneo
     (sin texto seleccionable) no hay nada que leer y el formulario se completa a mano, como antes. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if(window.pdfjsLib){
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  }
</script>
<style>
  :root{
    --bg:#f5f6f7;
    --surface:#ffffff;
    --surface-2:#eceef1;
    --border:#dde1e6;
    --text:#141a1f;
    --text-muted:#57626c;
    --accent:#0b4a6f;
    --accent-strong:#083752;
    --accent-contrast:#ffffff;
    --accent-soft:#e3edf3;
    --danger:#b3261e;
    --danger-soft:#fbe9e7;
    --warning:#8a5300;
    --warning-soft:#fff2df;
    --success:#186a41;
    --success-soft:#e3f5ea;
    --chip-pendiente:#57626c;
    --chip-pendiente-soft:#eceef1;
    --shadow:0 1px 2px rgba(20,26,31,.06), 0 1px 12px rgba(20,26,31,.05);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161a;
      --surface:#1a2126;
      --surface-2:#222a30;
      --border:#333e46;
      --text:#eef2f5;
      --text-muted:#9aa7b2;
      --accent:#5aa6d6;
      --accent-strong:#7ec1e8;
      --accent-contrast:#0b1a24;
      --accent-soft:#1c3140;
      --danger:#ff8a7a;
      --danger-soft:#3a1f1c;
      --warning:#ffbf5c;
      --warning-soft:#3a2a10;
      --success:#5fd39a;
      --success-soft:#123626;
      --chip-pendiente:#9aa7b2;
      --chip-pendiente-soft:#232c33;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 12px rgba(0,0,0,.25);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161a;
    --surface:#1a2126;
    --surface-2:#222a30;
    --border:#333e46;
    --text:#eef2f5;
    --text-muted:#9aa7b2;
    --accent:#5aa6d6;
    --accent-strong:#7ec1e8;
    --accent-contrast:#0b1a24;
    --accent-soft:#1c3140;
    --danger:#ff8a7a;
    --danger-soft:#3a1f1c;
    --warning:#ffbf5c;
    --warning-soft:#3a2a10;
    --success:#5fd39a;
    --success-soft:#123626;
    --chip-pendiente:#9aa7b2;
    --chip-pendiente-soft:#232c33;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 12px rgba(0,0,0,.25);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.45;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  #app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 32px;}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg);
    padding-block:14px 10px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:12px;}
  .brand h1{font-size:19px; font-weight:800; letter-spacing:-.01em; margin:0;}
  .brand span{font-size:12px; color:var(--text-muted); font-weight:600;}
  .segmented{display:flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:2px;}
  .segmented button{
    flex:1; border:0; background:transparent; color:var(--text-muted);
    font:inherit; font-weight:700; font-size:13.5px; padding:9px 6px; border-radius:9px;
    cursor:pointer;
  }
  .segmented button.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}

  .readonly-banner{
    background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning);
    border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:16px;
  }
  .error-banner{
    background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger);
    border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:16px;
  }
  .form-msg{font-size:12.5px; font-weight:700; margin-top:6px;}
  .form-msg.err{color:var(--danger);}
  .form-msg.ok{color:var(--success);}

  section.block{margin-bottom:28px;}
  .block-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .block-head h2{font-size:15px; font-weight:800; margin:0; letter-spacing:-.01em;}
  .block-head .count{font-size:12px; color:var(--text-muted); font-weight:600;}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:8px; margin-bottom:18px;}
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);}
  .stat-tile .n{font-family:"JetBrains Mono",monospace; font-size:20px; font-weight:700; line-height:1;}
  .stat-tile .l{font-size:11px; color:var(--text-muted); font-weight:600; margin-top:4px;}
  .stat-tile.alerta .n{color:var(--danger);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .card.crit-alta{border-left:4px solid var(--danger);}
  .card.crit-media{border-left:4px solid var(--warning);}
  .card.crit-baja{border-left:4px solid var(--success);}

  .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .title-line{font-weight:700; font-size:14.5px;}
  .sub-line{color:var(--text-muted); font-size:12.5px; margin-top:2px;}
  .meta-line{font-size:12.5px; color:var(--text-muted); margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 12px;}
  .meta-line b{color:var(--text); font-weight:600;}

  .chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:999px; white-space:nowrap; letter-spacing:.01em;
  }
  .chip-alta{background:var(--danger-soft); color:var(--danger);}
  .chip-media{background:var(--warning-soft); color:var(--warning);}
  .chip-baja{background:var(--success-soft); color:var(--success);}
  .chip-pendiente{background:var(--chip-pendiente-soft); color:var(--chip-pendiente);}
  .chip-recogido{background:var(--accent-soft); color:var(--accent);}
  .chip-entregado{background:var(--success-soft); color:var(--success);}

  .btn{
    font:inherit; font-weight:700; font-size:13px; border-radius:10px; border:1px solid transparent;
    padding:9px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-primary:active{background:var(--accent-strong);}
  .btn-ghost{background:var(--surface-2); color:var(--text);}
  .btn-outline{background:transparent; color:var(--accent); border-color:var(--accent);}
  .btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .icon-btn{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--text);}

  .actions-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

  form.editform{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px; box-shadow:var(--shadow);
  }
  form.editform h3{font-size:13.5px; margin:0 0 10px; font-weight:800;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11.5px; font-weight:700; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  input,select,textarea{
    width:100%; font:inherit; font-size:14px; background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:9px; padding:9px 10px;
  }
  textarea{resize:vertical; min-height:56px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
  .form-actions{display:flex; gap:8px; margin-top:4px;}

  .stop{margin-bottom:16px;}
  .stop-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .stop-num{
    width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; flex-shrink:0;
  }
  .stop-name{font-weight:800; font-size:15.5px;}
  .stop-addr{font-size:12.5px; color:var(--text-muted);}
  .stop-reorder{display:flex; flex-direction:column; gap:2px; margin-left:auto;}

  .oc-item{border-top:1px solid var(--border); padding-top:10px; margin-top:10px;}
  .oc-item:first-child{border-top:0; padding-top:0; margin-top:0;}

  .notes-toggle{background:none; border:0; color:var(--accent); font:inherit; font-weight:700; font-size:12.5px; padding:8px 0 0; cursor:pointer;}
  .notes-panel{margin-top:8px; background:var(--surface-2); border-radius:10px; padding:10px;}
  .log-entry{font-size:12.5px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border);}
  .log-entry:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0;}
  .log-meta{color:var(--text-muted); font-size:11px; margin-bottom:2px;}
  audio{width:100%; height:34px; margin-top:2px;}
  .note-add{display:flex; gap:6px; margin-top:8px;}
  .note-add textarea{min-height:38px; flex:1;}
  .voice-label{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text);}
  .voice-label input{display:none;}
  .voice-rec-box{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .rec-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--danger); margin-right:5px; animation:recpulse 1s infinite;}
  @keyframes recpulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .route-cta{position:sticky; bottom:env(safe-area-inset-bottom,0px); background:var(--bg); padding-block:10px; border-top:1px solid var(--border); margin-top:4px; z-index:15;}

  .empty{color:var(--text-muted); font-size:13px; background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:16px; text-align:center;}
  .example-tag{font-size:10px; font-weight:800; color:var(--accent); background:var(--accent-soft); padding:2px 6px; border-radius:6px; letter-spacing:.03em; text-transform:uppercase;}
  a.maplink{color:var(--accent); text-decoration:none; font-weight:700;}
  a.maplink:hover{text-decoration:underline;}
  @media (min-width:640px){ .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;} }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><h1>Ruta de Acopio</h1><span id="orgTag">INNOVECA · Materiales</span></div>
    <nav class="segmented" id="segmented">
      <button data-view="admin" id="tabAdmin">Planificación</button>
      <button data-view="ruta" id="tabRuta">Ruta del día</button>
    </nav>
  </header>
  <div id="dbBanner" class="error-banner" hidden>No se pudo conectar con la base de datos. Revisá tu conexión a internet y recargá la página.</div>
  <div id="readonlyBanner" class="readonly-banner" hidden>Modo solo lectura: esta vista no tiene permiso para editar. Pide acceso de Contribuidor o Editor para marcar recepciones y agregar notas.</div>
  <div id="nombreBar" class="hint" style="margin-bottom:14px;"></div>
  <div id="toast" class="error-banner" hidden></div>
  <main id="main"></main>
</div>

<script>
(function(){
  "use strict";

  // ---------- state ----------
  // Enlace del chofer: esta app ya es una página normal (no corre dentro de
  // ningún iframe), así que location.href refleja siempre la URL pública real.
  function driverLink(){ return location.origin + location.pathname + '#recolector'; }
  var collectorMode = /^#recolector$/i.test(location.hash||'');
  var db=null;
  var MAX_MEDIA_BYTES = 700*1024; // límite práctico para caber en un documento de Firestore (~1MB) codificado en base64
  var bootDone=false; // true once the initial capability resolution attempt has finished (success or fail)
  var canWrite=null; // true/false/null(unknown)
  var myId=null;     // nombre visible de quien está usando esta sesión (no hay cuentas; ver getMyNombre/setMyNombre)
  var myNombre=null;
  var editingNombre=false;
  var stores=[]; // {id,nombre,direccionCorta,lat,lng,notas,orden,example} — se reutilizan entre viajes, nunca se borran al cerrar un viaje
  var destinos=[]; // {id,nombre,direccionCorta,lat,lng,notas,orden,createdAt} — lugares de entrega, se guardan igual que las tiendas y se reutilizan entre viajes
  var ocs=[];    // {id,numero,proyecto,storeId,descripcion,criticidad,destino,destinoId,destinoLat,destinoLng,receptorNombre,receptorTelefono,fechaPactada,condicionEntrega,estado,fechaRecogida,fechaEntregada,recogidoPorId,entregadoPorId,log,example}
  var viajes=[]; // {id,cerradoAt,cerradoPorId,ocs:[...snapshot],resumen:{total,entregadas,recogidas,pendientes}} — historial de viajes cerrados
  var puntoInicio=null; // {nombre,direccionCorta,lat,lng} — punto fijo de salida del conductor (bodega/oficina), configurado una sola vez
  // Datos que llegan por enlace desde el artefacto de Claude (extracción de PDF de OC):
  // ?prefill=<json> — se leen una sola vez al cargar y se usan para precompletar
  // el formulario de "Agregar OC" (ver renderOcForm / of.onsubmit).
  var prefillData = null;
  (function(){
    try{
      var params = new URLSearchParams(location.search);
      var raw = params.get('prefill');
      if(raw){
        prefillData = JSON.parse(raw);
        var url = new URL(location.href);
        url.searchParams.delete('prefill');
        history.replaceState(null, '', url.pathname + (url.search||'') + (location.hash||''));
      }
    }catch(e){ console.warn('no se pudo leer ?prefill=', e); prefillData = null; }
  })();
  var view = prefillData ? 'admin' : (collectorMode ? 'ruta' : ((window.matchMedia && window.matchMedia('(max-width: 640px)').matches) ? 'ruta' : 'admin'));
  var editingStoreId=null; // null = add mode
  var editingDestinoId=null; // null = add mode
  var editingOcId=null;
  var ocFormMode='oc'; // 'oc' | 'item' — modo del formulario "Agregar OC/ítem" cuando no se está editando uno existente
  var editingPuntoInicio=false;
  var expandedNotes={}; // ocId -> bool
  var expandedTrips={}; // tripId -> bool
  var confirming={}; // key -> timeout id
  var voiceRec={}; // ocId -> {state:'recording'|'preview'|'saving'|'error', recorder, stream, chunks, startedAt, timerId, blob, blobUrl, mimeType, error}

  function $(sel,root){return (root||document).querySelector(sel);}
  function $all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
  function esc(s){ s = (s===undefined||s===null)?'':String(s); return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function uid(){ try{ return crypto.randomUUID(); }catch(e){ return 'id'+Date.now()+Math.random().toString(16).slice(2); } }

  // ---------- helpers: coords / maps ----------
  function parseCoords(input){
    if(!input) return null;
    input = String(input).trim();
    var m = input.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
    if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
    m = input.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
    m = input.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/);
    if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
    m = input.match(/[?&](?:q|ll|query)=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
    return null;
  }
  function storeDestParam(s){
    return (s && s.lat!=null && s.lng!=null) ? (s.lat+','+s.lng) : ((s && s.direccionCorta) || '');
  }
  function storeMapsUrl(s){
    var dest = storeDestParam(s);
    if(!dest) return null;
    return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode=driving';
  }
  function textDestMapsUrl(addr){
    if(!addr) return null;
    return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr)+'&travelmode=driving';
  }
  // Empareja un texto libre (extraído de un PDF o guardado antes de que
  // existiera el picklist) contra una lista {id,nombre,...} — primero por
  // igualdad exacta (sin mayúsculas/acentos de más) y si no por contención,
  // para no perder coincidencias como "Global Supply" vs "Global Supply (Heredia)".
  function normText(s){
    return String(s||'').trim().toLowerCase();
  }
  function matchByName(list, text){
    var t = normText(text);
    if(!t) return null;
    var exact = list.find(function(x){ return normText(x.nombre)===t; });
    if(exact) return exact;
    var contains = list.find(function(x){
      var n = normText(x.nombre);
      return n && (t.indexOf(n)!==-1 || n.indexOf(t)!==-1);
    });
    return contains || null;
  }
  function fullRouteUrl(orderedStores, origin){
    if(!orderedStores.length) return null;
    var last = orderedStores[orderedStores.length-1];
    var wps = orderedStores.slice(0,-1).map(storeDestParam).filter(Boolean);
    var url = 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(storeDestParam(last))+'&travelmode=driving';
    if(wps.length) url += '&waypoints='+encodeURIComponent(wps.join('|'));
    if(origin) url += '&origin='+encodeURIComponent(origin);
    return url;
  }
  function fmtDate(d){
    if(!d) return '';
    try{
      var dt = new Date(d+'T00:00:00');
      if(isNaN(dt.getTime())) return d;
      return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();
    }catch(e){ return d; }
  }
  function fmtTs(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('es-CR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'});
    }catch(e){ return ''; }
  }
  var CRIT_LABEL={alta:'Alta',media:'Media',baja:'Baja'};
  var EST_LABEL={pendiente:'Pendiente',recogido:'Recogida',entregado:'Entregada'};

  // ---------- Firebase bootstrap (sin cuentas: autenticación anónima) ----------
  // Reemplazá estos valores por los de tu propio proyecto de Firebase
  // (Firebase console -> Configuración del proyecto -> tus apps -> config del SDK).
  // Son datos públicos (no son contraseñas): quedan visibles en el código de la
  // página igual que en cualquier app web que use Firebase.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCC497gKVlUfW-AYhnitDbFigocE2JCqyM",
    authDomain: "innoveca-ruta-de-materiales.firebaseapp.com",
    projectId: "innoveca-ruta-de-materiales",
    storageBucket: "innoveca-ruta-de-materiales.firebasestorage.app",
    messagingSenderId: "164293917076",
    appId: "1:164293917076:web:5a42ac0d54b707e642f781"
  };
  function getMyNombre(){
    try{ return localStorage.getItem('ra_nombre') || null; }catch(e){ return null; }
  }
  function setMyNombre(n){
    myNombre = n;
    try{ localStorage.setItem('ra_nombre', n); }catch(e){}
  }
  async function boot(){
    try{
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      if(!firebase.auth().currentUser){ await firebase.auth().signInAnonymously(); }
      db = firebase.firestore();

      console.warn('firebase init failed', e);

    bootDone = true;
    updateBanners();
    if(db){
      // Primero una lectura puntual (más confiable que depender solo del
      // stream en vivo para el primer pintado) — así la pantalla nunca se
      // queda en "0" solo porque la suscripción en vivo tardó o no llegó.
      await reloadDataOnce();
      hardRender();
      db.collection('stores').onSnapshot(function(snap){
        stores = snap.docs.map(function(d){ var raw=d.data()||{}; var o={}; for(var k in raw){ o[k]=raw[k]; } o.id=d.id; return o; });
        stores.sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
        render();
      }, function(err){ console.warn('stores snapshot error', err); dbBroken=true; updateBanners(); });
      db.collection('destinos').onSnapshot(function(snap){
        destinos = snap.docs.map(function(d){ var raw=d.data()||{}; var o={}; for(var k in raw){ o[k]=raw[k]; } o.id=d.id; return o; });
        destinos.sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
        render();
      }, function(err){ console.warn('destinos snapshot error', err); });
      db.collection('ocs').onSnapshot(function(snap){
        ocs = snap.docs.map(function(d){ var raw=d.data()||{}; var o={}; for(var k in raw){ o[k]=raw[k]; } o.id=d.id; if(!Array.isArray(o.log)) o.log=[]; return o; });
        render();
      }, function(err){ console.warn('ocs snapshot error', err); dbBroken=true; updateBanners(); });
      db.collection('viajes').onSnapshot(function(snap){
        viajes = snap.docs.map(function(d){ var raw=d.data()||{}; var v={}; for(var k in raw){ v[k]=raw[k]; } v.id=d.id; if(!Array.isArray(v.ocs)) v.ocs=[]; return v; });
        viajes.sort(function(a,b){ return (b.cerradoAt||'').localeCompare(a.cerradoAt||''); });
        render();
      }, function(err){ console.warn('viajes snapshot error', err); });
      db.doc('config/puntoInicio').onSnapshot(function(snap){
        puntoInicio = snap.exists ? (snap.data()||null) : null;
        render();
      }, function(err){ console.warn('puntoInicio snapshot error', err); });
    } else {
      hardRender();
    }
  }

  // Lectura puntual de las 4 colecciones/documento — se usa al arrancar y

  var lastReloadError = null;
  function captureReloadErr(e){
    console.warn('reloadDataOnce error', e);

  async function reloadDataOnce(){
    if(!db) return;
    var ok = true;
    lastReloadError = null;
    try{
      var storesSnap = await db.collection('stores').get();
      stores = storesSnap.docs.map(function(d){ var raw=d.data()||{}; var o={}; for(var k in raw){ o[k]=raw[k]; } o.id=d.id; return o; });
      stores.sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
    }catch(e){ ok=false; captureReloadErr(e); }
    try{
      var destinosSnap = await db.collection('destinos').get();
      destinos = destinosSnap.docs.map(function(d){ var raw=d.data()||{}; var o={}; for(var k in raw){ o[k]=raw[k]; } o.id=d.id; return o; });
      destinos.sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
    }catch(e){ ok=false; captureReloadErr(e); }
    try{
      var ocsSnap = await db.collection('ocs').get();
      ocs = ocsSnap.docs.map(function(d){ var raw=d.data()||{}; var o={}; for(var k in raw){ o[k]=raw[k]; } o.id=d.id; if(!Array.isArray(o.log)) o.log=[]; return o; });
    }catch(e){ ok=false; captureReloadErr(e); }
    try{
      var viajesSnap = await db.collection('viajes').get();
      viajes = viajesSnap.docs.map(function(d){ var raw=d.data()||{}; var v={}; for(var k in raw){ v[k]=raw[k]; } v.id=d.id; if(!Array.isArray(v.ocs)) v.ocs=[]; return v; });
      viajes.sort(function(a,b){ return (b.cerradoAt||'').localeCompare(a.cerradoAt||''); });
    }catch(e){ ok=false; captureReloadErr(e); }
    try{
      var piSnap = await db.doc('config/puntoInicio').get();
      puntoInicio = piSnap.exists ? (piSnap.data()||null) : null;
    }catch(e){ ok=false; captureReloadErr(e); }
    dbBroken = !ok;
    updateBanners();
    return ok;
  }

  // ---------- punto de inicio (salida fija del chofer) ----------
  function haversineKm(lat1,lng1,lat2,lng2){
    var R=6371;
    var dLat=(lat2-lat1)*Math.PI/180;
    var dLng=(lng2-lng1)*Math.PI/180;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    var c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return R*c;
  }
  async function savePuntoInicio(data){
    if(!db) throw new Error('sin_db');
    var body = {
      nombre: data.nombre||'',
      direccionCorta: data.direccionCorta||'',
      lat: data.lat!=null ? data.lat : null,
      lng: data.lng!=null ? data.lng : null,
      updatedAt: new Date().toISOString()
    };
    await db.doc('config/puntoInicio').set(body);
    puntoInicio = body;
  }
  async function recalcularOrdenPorCercania(){
    if(!db) throw new Error('sin_db');
    if(!puntoInicio || puntoInicio.lat==null || puntoInicio.lng==null) throw new Error('sin_punto_inicio');
    var withCoords = stores.filter(function(s){return s.lat!=null && s.lng!=null;});
    var withoutCoords = stores.filter(function(s){return s.lat==null || s.lng==null;});
    var remaining = withCoords.slice();
    var ordered = [];
    var curLat = puntoInicio.lat, curLng = puntoInicio.lng;
    while(remaining.length){
      var bestIdx=0, bestDist=Infinity;
      for(var i=0;i<remaining.length;i++){
        var d = haversineKm(curLat,curLng,remaining[i].lat,remaining[i].lng);
        if(d<bestDist){ bestDist=d; bestIdx=i; }
      }
      var next = remaining.splice(bestIdx,1)[0];
      ordered.push(next);
      curLat=next.lat; curLng=next.lng;
    }
    var finalList = ordered.concat(withoutCoords);
    await Promise.all(finalList.map(function(s, idx){
      var orden=(idx+1)*10;
      return db.collection('stores').doc(s.id).update({orden:orden});
    }));
    finalList.forEach(function(s, idx){ s.orden=(idx+1)*10; });
    stores.sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
  }

  // ---------- CRUD: viajes (cerrar viaje = archivar las OCs activas y arrancar de cero) ----------
  // Las tiendas NUNCA se tocan acá: se guardan una sola vez y sirven para todos los viajes futuros.
  async function closeTrip(){
    if(!db) throw new Error('sin_db');
    var snapshotOcs = ocs.map(function(o){
      var store = stores.find(function(s){return s.id===o.storeId;});
      var copy = {}; for(var k in o){ copy[k]=o[k]; }
      copy.storeNombre = store ? store.nombre : '';
      return copy;
    });
    var resumen = {
      total: snapshotOcs.length,
      entregadas: snapshotOcs.filter(function(o){return o.estado==='entregado';}).length,
      recogidas: snapshotOcs.filter(function(o){return o.estado==='recogido';}).length,
      pendientes: snapshotOcs.filter(function(o){return o.estado==='pendiente';}).length
    };
    var tripDoc = {
      cerradoAt: new Date().toISOString(),
      cerradoPorId: myId||null,
      ocs: snapshotOcs,
      resumen: resumen
    };
    var ref = await db.collection('viajes').add(tripDoc);
    var localCopy = {}; for(var k2 in tripDoc){ localCopy[k2]=tripDoc[k2]; } localCopy.id = ref.id;
    viajes.push(localCopy);
    viajes.sort(function(a,b){ return (b.cerradoAt||'').localeCompare(a.cerradoAt||''); });
    // ahora sí, vaciar las OCs activas para que el próximo viaje arranque limpio.
    // las tiendas quedan intactas.
    var toDelete = ocs.slice();
    ocs = [];
    var results = await Promise.allSettled(toDelete.map(function(o){ return db.collection('ocs').doc(o.id).delete(); }));
    var failed = results.filter(function(r){ return r.status==='rejected'; }).length;
    if(failed){ throw new Error('parcial: '+failed+' OC(s) no se pudieron borrar de la lista activa, pero el viaje ya quedó guardado en el historial.'); }
  }

  // ---------- render root ----------
  // rebuild(): always regenerates #main from current state.
  // render(): same, but preserves whatever a person is mid-typing in any
  //   input/textarea/select (used for background data updates, e.g. a
  //   db snapshot arriving while someone is filling a form).
  // hardRender(): same as rebuild(), used after a deliberate action
  //   (Editar, Cancelar, guardado con éxito, cambio de vista) where the
  //   fresh state should win over whatever was on screen before.
  function captureDraft(){
    var d={};
    $all('#main input, #main textarea, #main select', document).forEach(function(el){
      if(!el.id || el.type==='file') return;
      d[el.id]=el.value;
    });
    return d;
  }
  function applyDraft(d){
    Object.keys(d).forEach(function(id){
      var el=document.getElementById(id);
      if(el && el.type!=='file') el.value=d[id];
    });
  }
  function rebuild(){
    $('#tabAdmin').classList.toggle('active', view==='admin');
    $('#tabRuta').classList.toggle('active', view==='ruta');
    var main = $('#main');
    if(bootDone && !db){
      main.innerHTML = renderNoDbScreen();
      wireNoDbScreen(main);
      return;
    }
    main.innerHTML = view==='admin' ? renderAdminHtml() : renderRutaHtml();
    wireCommon(main);
    if(view==='admin') wireAdmin(main); else wireRuta(main);
    resolveNames(main);
  }

  async function viewPdf(mediaId, btn){
    var win = null;
    try{ win = window.open('', '_blank'); }catch(e){}
    var prevText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent='Abriendo...'; }
    try{
      var d = await getMedia(mediaId);
      var blob = base64ToBlob(d.data, d.mime||'application/pdf');
      var objUrl = URL.createObjectURL(blob);
      if(win && !win.closed){ win.location = objUrl; }
      else { var a=document.createElement('a'); a.href=objUrl; a.target='_blank'; a.rel='noopener'; a.click(); }
    }catch(e){
      if(win && !win.closed) win.close();
      alertLikeBanner('No se pudo abrir el PDF. Probá de nuevo.');
    }
    if(btn){ btn.disabled = false; btn.textContent = prevText; }
  }

  function pickAudioMime(){
    var candidates=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
    for(var i=0;i<candidates.length;i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return '';
  }

  function blobToBase64(blob){
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){
        var res = reader.result||'';
        var idx = res.indexOf(',');
        resolve(idx>=0 ? res.slice(idx+1) : res);
      };
      reader.onerror = function(){ reject(reader.error||new Error('read_error')); };
      reader.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64, mime){
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr], {type:mime||'application/octet-stream'});
  }

  // ---------- PDFs y notas de voz: guardados como texto (base64) en Firestore,
  // en la colección "media" — evita depender de Firebase Storage (que requiere
  // el plan de pago Blaze). Cada documento cabe en el límite de ~1MB de Firestore.
  async function saveMedia(kind, ocId, base64, mime){
    if(!db) throw new Error('sin_db');
    var ref = await db.collection('media').add({
      kind: kind, ocId: ocId, mime: mime, data: base64, createdAt: new Date().toISOString()
    });
    return ref.id;
  }
  async function getMedia(mediaId){
    if(!db) throw new Error('sin_db');
    var snap = await db.collection('media').doc(mediaId).get();
    if(!snap.exists) throw new Error('media_no_encontrada');
    return snap.data();
  }

  // ---------- Autocompletado desde el PDF de la OC (pdf.js, 100% en el navegador) ----------
  // Extrae el texto del PDF y usa patrones (regex) para adivinar los campos del formulario.
  // Si el PDF es un escaneo/foto sin texto seleccionable, no hay nada que leer: el usuario
  // completa a mano, exactamente como antes de este cambio.
  async function extractPdfText(file){
    if(!window.pdfjsLib) return '';
    try{
      var buf = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({data:buf}).promise;
      var text = '';
      var maxPages = Math.min(pdf.numPages||1, 8);
      for(var i=1;i<=maxPages;i++){
        var page = await pdf.getPage(i);
        var content = await page.getTextContent();
        var lastY = null, line = '';
        content.items.forEach(function(it){
          var y = it.transform ? it.transform[5] : null;
          if(lastY!==null && y!==null && Math.abs(y-lastY)>2){
            text += line.trim()+'\n';
            line = '';
          }
          line += (it.str||'')+' ';
          if(y!==null) lastY = y;
        });
        if(line.trim()) text += line.trim()+'\n';
        text += '\n';
      }
      return text;
    }catch(e){
      console.warn('extractPdfText failed', e);
      return '';
    }
  }

  };

  function quitarAcentos(s){
    return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
  }

  function toIsoDateSafe(y,m,d){
    y = parseInt(y,10); m = parseInt(m,10); d = parseInt(d,10);
    if(!y||!m||!d) return null;
    if(y<100) y += 2000;
    if(m<1||m>12||d<1||d>31) return null;
    var mm = (m<10?'0':'')+m, dd = (d<10?'0':'')+d;
    return y+'-'+mm+'-'+dd;
  }

  function findFirstDateIso(text){
    if(!text) return null;
    var m = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
    if(m){ var iso = toIsoDateSafe(m[3],m[2],m[1]); if(iso) return iso; }
    m = text.match(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/);
    if(m){ var iso2 = toIsoDateSafe(m[1],m[2],m[3]); if(iso2) return iso2; }
    m = text.match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)\s+de[l]?\s+(\d{4})/i);
    if(m){
      var mesNum = MESES_ES[quitarAcentos(m[2]).toLowerCase()];
      if(mesNum){ var iso3 = toIsoDateSafe(m[3], mesNum, m[1]); if(iso3) return iso3; }
    }
    return null;
  }

  function matchAny(text, patterns){
    for(var i=0;i<patterns.length;i++){
      var m = text.match(patterns[i]);
      if(m && m[1]){
        var v = m[1].trim().replace(/[\s.;,]+$/,'');
        if(v) return v;
      }
    }
    return null;
  }

  function guessOcFieldsFromText(text){
    var out = {};
    if(!text) return out;
    out.numero = matchAny(text, [
      /orden\s+de\s+compra\s*(?:n[°ºo]\.?|no\.?|n[uú]mero)?\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,20})/i,
      /\bo\.?\s?c\.?\s*(?:n[°ºo]\.?|no\.?)?\s*[:#]\s*([A-Z0-9][A-Z0-9\-\/\.]{2,20})/i,
      /purchase\s*order\s*(?:no\.?|number|#)?\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,20})/i,
      /\bP\.?O\.?\s*#?\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,20})/,
    ]) || (text.match(/\bOC[-\s]?\d{3,8}\b/i)||[])[0] || null;
    out.proyecto = matchAny(text, [
      /proyecto\s*[:#]?\s*([^\n]{2,60})/i,
      /\bobra\s*[:#]?\s*([^\n]{2,60})/i
    ]);
    out.descripcion = matchAny(text, [
      /descripci[oó]n\s*[:#]?\s*([^\n]{3,120})/i,
      /detalle\s*[:#]?\s*([^\n]{3,120})/i,
      /materiales\s*[:#]?\s*([^\n]{3,120})/i
    ]);
    out.destino = matchAny(text, [
      /direcci[oó]n\s+de\s+entrega\s*[:#]?\s*([^\n]{4,140})/i,
      /lugar\s+de\s+entrega\s*[:#]?\s*([^\n]{4,140})/i,
      /entregar\s+en\s*[:#]?\s*([^\n]{4,140})/i
    ]);
    out.receptorNombre = matchAny(text, [
      /(?:recibe|atenci[oó]n|contacto|encargado)\s*[:#]?\s*([^\n]{2,60})/i
    ]);
    out.receptorTelefono = matchAny(text, [
      /(?:tel[eé]fono|tel\.?|cel(?:ular)?)\s*[:#]?\s*(\+?\d[\d\s\-]{6,15}\d)/i
    ]);
    var fechaLabelMatch = text.match(/(?:fecha\s+(?:de\s+)?entrega(?:\s+pactada)?|entrega\s+requerida|fecha\s+requerida|fecha\s+de\s+necesidad)\s*[:#]?\s*([^\n]{4,40})/i);
    out.fechaPactada = (fechaLabelMatch && findFirstDateIso(fechaLabelMatch[1])) || findFirstDateIso(text) || null;
    return out;
  }

  async function voiceStart(id){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      voiceRec[id]={state:'error', error:'Este navegador no soporta grabar audio. Probá desde Chrome o Safari actualizados.'};
      hardRender(); return;
    }
    voiceRec[id]={state:'requesting'};
    hardRender();
    try{
      var stream = await navigator.mediaDevices.getUserMedia({audio:true});
      var mime = pickAudioMime();
      var rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      var chunks = [];
      rec.ondataavailable = function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
      rec.onstop = function(){
        var finalMime = rec.mimeType || mime || 'audio/webm';
        var blob = new Blob(chunks, {type:finalMime});
        try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e2){}
        var prev = voiceRec[id]||{};
        if(prev.timerId) clearInterval(prev.timerId);
        voiceRec[id] = {state:'preview', blob:blob, blobUrl:URL.createObjectURL(blob), mimeType:finalMime, startedAt:prev.startedAt};
        hardRender();
      };
      voiceRec[id] = {state:'recording', recorder:rec, stream:stream, startedAt:Date.now()};
      rec.start();
      voiceRec[id].timerId = setInterval(function(){
        var st = voiceRec[id];
        if(!st || st.state!=='recording') return;
        var secs = Math.floor((Date.now()-st.startedAt)/1000);
        var el = document.getElementById('rec_timer_'+id);
        if(el) el.textContent = fmtRecSecs(secs);
        if(secs>=90) voiceStop(id); // tope de 1:30 — así la nota entra cómoda en el límite de tamaño de Firestore
      }, 500);
      hardRender();
    }catch(e){
      voiceRec[id]={state:'error', error:'No se pudo acceder al micrófono. Revisá los permisos del navegador para este sitio.'};
      hardRender();
    }
  }

  function voiceStop(id){
    var st = voiceRec[id];
    if(!st || st.state!=='recording') return;
    try{ st.recorder.stop(); }catch(e){}
  }

  function voiceCancel(id){
    var st = voiceRec[id];
    if(!st) return;
    if(st.timerId) clearInterval(st.timerId);
    if(st.recorder && st.state==='recording'){
      st.recorder.onstop = null;
      try{ st.recorder.stop(); }catch(e){}
    }
    if(st.stream){ try{ st.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} }
    delete voiceRec[id];
    hardRender();
  }

  function voiceDiscard(id){
    var st = voiceRec[id];
    if(st && st.blobUrl){ try{ URL.revokeObjectURL(st.blobUrl); }catch(e){} }
    delete voiceRec[id];
    hardRender();
  }

  async function voiceSave(id){
    var st = voiceRec[id];
    if(!st || !st.blob) return;
    if(!db){ st.error='No se pudo guardar (sin conexión).'; hardRender(); return; }
    var blob = st.blob, blobUrl = st.blobUrl, mimeType = st.mimeType;
    if(blob.size > MAX_MEDIA_BYTES){
      voiceRec[id] = {state:'preview', blob:blob, blobUrl:blobUrl, mimeType:mimeType, error:'La nota quedó muy pesada para guardarla. Probá una más corta.'};
      hardRender();
      return;
    }
    voiceRec[id] = {state:'saving', blob:blob, blobUrl:blobUrl, mimeType:mimeType};
    hardRender();
    try{
      var b64 = await blobToBase64(blob);
      var mediaId = await saveMedia('audio', id, b64, mimeType);
      var o = ocs.find(function(x){return x.id===id;});
      await addLogEntry(o, {type:'audio', mediaId:mediaId, mime:mimeType});
      try{ URL.revokeObjectURL(blobUrl); }catch(e){}
      delete voiceRec[id];
      hardRender();
    }catch(e){
      voiceRec[id] = {state:'preview', blob:blob, blobUrl:blobUrl, mimeType:mimeType, error:'Error al guardar la nota de voz. Probá de nuevo.'};
      hardRender();
    }
  }

  async function playAudioNote(wrap, btn){
    var mediaId = wrap.getAttribute('data-audio-media-id');
    if(!mediaId){ btn.textContent='Nota no disponible.'; return; }
    btn.disabled = true; btn.textContent='Cargando...';
    try{
      var d = await getMedia(mediaId);
      var blob = base64ToBlob(d.data, d.mime||'audio/webm');
      var objUrl = URL.createObjectURL(blob);
      wrap.innerHTML = '<audio controls autoplay src="'+objUrl+'"></audio>';
    }catch(e){
      btn.disabled = false; btn.textContent='Error al cargar. Tocá para reintentar';
    }
  }

  function renderRutaHtml(){
    var activeStoreIds = {};
    ocs.forEach(function(o){ if(o.estado!=='entregado') activeStoreIds[o.storeId]=true; });
    var routeStores = stores.filter(function(s){ return activeStoreIds[s.id]; });
    if(!routeStores.length) routeStores = stores.slice();

    // paradas de entrega: un lugar de entrega entra a la ruta si tiene alguna
    // OC activa (pendiente o recogida, todavía no entregada) apuntando a él.
    // Van después de las paradas de recolección, en el orden en que aparecen
    // sus OCs.
    var activeDestinoIds = {};
    var destinoOrder = [];
    ocs.forEach(function(o){
      if(o.estado!=='entregado' && o.destinoId && !activeDestinoIds[o.destinoId]){
        activeDestinoIds[o.destinoId] = true;
        destinoOrder.push(o.destinoId);
      }
    });
    var routeDestinos = destinoOrder.map(function(id){ return destinos.find(function(d){return d.id===id;}); }).filter(Boolean);

    var pend = ocs.filter(function(o){return o.estado==='pendiente';}).length;
    var recogidas = ocs.filter(function(o){return o.estado==='recogido';}).length;
    var entregadas = ocs.filter(function(o){return o.estado==='entregado';}).length;
    var crit = ocs.filter(function(o){return o.criticidad==='alta' && o.estado!=='entregado';}).length;

    var html = '<div class="stat-row">'+
      '<div class="stat-tile"><div class="n mono">'+pend+'</div><div class="l">Por recoger</div></div>'+
      '<div class="stat-tile"><div class="n mono">'+recogidas+'</div><div class="l">Recogidas</div></div>'+
      '<div class="stat-tile"><div class="n mono">'+entregadas+'</div><div class="l">Entregadas</div></div>'+
      '<div class="stat-tile'+(crit?' alerta':'')+'"><div class="n mono">'+crit+'</div><div class="l">Críticas</div></div>'+
    '</div>';
    html += '<div class="actions-row" style="margin:-8px 0 14px;"><button class="btn btn-ghost btn-sm" type="button" data-act="reload-data">🔄 Actualizar datos</button></div>';

    if(puntoInicio){
      var piMapsUrl = storeMapsUrl(puntoInicio);
      html += '<div class="stop" style="border-left:4px solid var(--accent);">'+
        '<div class="stop-head">'+
          '<div class="stop-num">🚩</div>'+
          '<div><div class="stop-name">Salida: '+esc(puntoInicio.nombre||'Punto de salida')+'</div><div class="stop-addr">'+esc(puntoInicio.direccionCorta||'')+'</div></div>'+
        '</div>'+
        (piMapsUrl? '<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="'+piMapsUrl+'">Abrir en Maps ↗</a>' : '')+
      '</div>';
    }

    if(!routeStores.length && !routeDestinos.length){
      html += '<div class="empty">No hay paradas todavía. Agrega tiendas y OCs desde "Planificación".</div>';
      return html;
    }

    if(canWrite!==false && !collectorMode && puntoInicio && puntoInicio.lat!=null){
      html += '<div class="actions-row" style="margin:10px 0;"><button class="btn btn-outline btn-sm" type="button" data-act="recalc-orden">📍 Recalcular orden por cercanía a la salida</button></div>';
    }

    routeStores.forEach(function(s, idx){
      var stopOcs = ocs.filter(function(o){return o.storeId===s.id;});
      var mapsUrl = storeMapsUrl(s);
      var hasCrit = stopOcs.some(function(o){return o.criticidad==='alta' && o.estado!=='entregado';});
      html += '<div class="stop" data-store-id="'+s.id+'">'+

          (canWrite!==false && !collectorMode? (
            '<div class="stop-reorder">'+
              '<button class="icon-btn" data-act="store-up" data-id="'+s.id+'" title="Subir">↑</button>'+
              '<button class="icon-btn" data-act="store-down" data-id="'+s.id+'" title="Bajar">↓</button>'+
            '</div>'
          ):'') +
        '</div>'+
        (mapsUrl? '<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="'+mapsUrl+'">Abrir esta parada en Maps ↗</a>' : '') +

      '</div>';
    });

    routeDestinos.forEach(function(d, idx){
      var stopOcs = ocs.filter(function(o){return o.destinoId===d.id && o.estado!=='entregado';});
      var mapsUrl = storeMapsUrl(d);
      var hasCrit = stopOcs.some(function(o){return o.criticidad==='alta' && o.estado!=='entregado';});
      html += '<div class="stop" data-destino-id="'+d.id+'" style="border-left:3px solid var(--success);">'+

        '</div>'+
        (mapsUrl? '<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="'+mapsUrl+'">Abrir esta parada en Maps ↗</a>' : '') +
        (stopOcs.length? stopOcs.map(function(o){return '<div class="oc-item">'+renderOcCard(o,true,collectorMode)+'</div>';}).join('') : '')+
      '</div>';
    });

    var allStops = routeStores.concat(routeDestinos);
    var routeUrl = fullRouteUrl(allStops);
    var originExplicit = (puntoInicio && puntoInicio.lat!=null) ? storeDestParam(puntoInicio) : null;
    var routeUrlFromPunto = (routeUrl && originExplicit) ? fullRouteUrl(allStops, originExplicit) : null;
    if(routeUrl){
      html += '<div class="route-cta">'+
        '<a class="btn btn-primary btn-block" target="_blank" rel="noopener" href="'+routeUrl+'">🧭 Abrir ruta completa (tu ubicación actual)</a>'+
        (routeUrlFromPunto? '<a class="btn btn-outline btn-block" style="margin-top:8px;" target="_blank" rel="noopener" href="'+routeUrlFromPunto+'">🧭 Abrir ruta completa (desde '+esc(puntoInicio.nombre||'la salida')+')</a>' : '')+
      '</div>';
    }
    return html;
  }

          console.warn('reloadDataOnce failed', e);

          alertLikeBanner('No se pudo actualizar. Probá de nuevo en un momento.');

      b.onclick = function(){ view=b.getAttribute('data-view'); try{localStorage.setItem('ra_view',view);}catch(e){} hardRender(); };

  function describeError(e){
    if(e && e.message==='sin_db') return 'No hay conexión con la base de datos. Revisá tu internet y recargá la página.';
    if(e && e.code==='invalid_argument') return 'No se pudo guardar: revisá que los campos obligatorios estén completos.';
    if(e && e.code) return 'No se pudo guardar (' + e.code + '). Probá de nuevo en un momento.';
    return 'No se pudo guardar. Probá de nuevo.';
  }

  function wireAdmin(root){
    $all('[data-act="copy-driver-link"]', root).forEach(function(b){
      b.onclick = function(){
        var link = driverLink();
        var msg = $('#driverLinkMsg', root);
        function ok(){ if(msg){ msg.className='form-msg ok'; msg.textContent='¡Copiado! Ya lo podés pegar en WhatsApp o donde prefieras.'; } }
        function fail(){
          var inp = $('#driverLinkInput', root);
          if(inp){ inp.select(); inp.setSelectionRange(0,99999); }
          if(msg){ msg.className='form-msg err'; msg.textContent='No se pudo copiar automático — el texto ya está seleccionado, usá Ctrl/Cmd+C.'; }
        }
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(link).then(ok, fail);
        } else {
          try{
            var inp = $('#driverLinkInput', root);
            inp.select(); inp.setSelectionRange(0,99999);
            if(document.execCommand('copy')) ok(); else fail();
          }catch(e){ fail(); }
        }
      };
    });
    var sf = $('#storeForm', root);
    if(sf){
      sf.onsubmit = async function(ev){
        ev.preventDefault();
        var msg = $('#storeFormMsg', root);
        if(msg){ msg.className='form-msg'; msg.textContent=''; }
        var coords = parseCoords($('#sf_coords',root).value);
        var data = {
          nombre: $('#sf_nombre',root).value.trim(),
          direccionCorta: $('#sf_dir',root).value.trim(),
          lat: coords? coords.lat: null,
          lng: coords? coords.lng: null,
          notas: $('#sf_notas',root).value.trim()
        };
        if(!data.nombre || !data.direccionCorta){
          if(msg){ msg.className='form-msg err'; msg.textContent='Completá al menos el nombre y la dirección corta.'; }
          return;
        }
        var submitBtn = sf.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.disabled = true;
        try{
          await saveStore(data);
        }catch(e){
          console.warn('saveStore failed', e);
          if(submitBtn) submitBtn.disabled = false;
          if(msg){ msg.className='form-msg err'; msg.textContent=describeError(e); }
          return;
        }
        // el guardado en la base de datos ya se confirmó en este punto;
        // un problema al redibujar la pantalla no debe leerse como que no se guardó.
        editingStoreId=null;
        try{ hardRender(); }catch(e2){ console.warn('render after saveStore failed', e2); }
        var okMsg = document.getElementById('storeFormMsg');
        if(okMsg){ okMsg.className='form-msg ok'; okMsg.textContent='Tienda agregada ✓'; }
      };
      var cancel = $('#storeCancel', root);
      if(cancel) cancel.onclick=function(){ editingStoreId=null; hardRender(); };
    }
    var df = $('#destinoForm', root);
    if(df){
      df.onsubmit = async function(ev){
        ev.preventDefault();
        var msg = $('#destinoFormMsg', root);
        if(msg){ msg.className='form-msg'; msg.textContent=''; }
        var coords = parseCoords($('#df_coords',root).value);
        var data = {
          nombre: $('#df_nombre',root).value.trim(),
          direccionCorta: $('#df_dir',root).value.trim(),
          lat: coords? coords.lat: null,
          lng: coords? coords.lng: null,
          notas: $('#df_notas',root).value.trim()
        };
        if(!data.nombre || !data.direccionCorta){
          if(msg){ msg.className='form-msg err'; msg.textContent='Completá al menos el nombre y la dirección corta.'; }
          return;
        }
        var submitBtn = df.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.disabled = true;
        try{
          await saveDestino(data);
        }catch(e){
          console.warn('saveDestino failed', e);
          if(submitBtn) submitBtn.disabled = false;
          if(msg){ msg.className='form-msg err'; msg.textContent=describeError(e); }
          return;
        }
        editingDestinoId=null;
        try{ hardRender(); }catch(e2){ console.warn('render after saveDestino failed', e2); }
        var okMsg = document.getElementById('destinoFormMsg');
        if(okMsg){ okMsg.className='form-msg ok'; okMsg.textContent='Lugar de entrega agregado ✓'; }
      };
      var dcancel = $('#destinoCancel', root);
      if(dcancel) dcancel.onclick=function(){ editingDestinoId=null; hardRender(); };
    }
    var pf = $('#puntoInicioForm', root);
    if(pf){
      pf.onsubmit = async function(ev){
        ev.preventDefault();
        var msg = $('#puntoInicioFormMsg', root);
        if(msg){ msg.className='form-msg'; msg.textContent=''; }
        var coords = parseCoords($('#pi_coords',root).value);
        var data = {
          nombre: $('#pi_nombre',root).value.trim(),
          direccionCorta: $('#pi_dir',root).value.trim(),
          lat: coords? coords.lat: null,
          lng: coords? coords.lng: null
        };
        if(!data.nombre || !data.direccionCorta){
          if(msg){ msg.className='form-msg err'; msg.textContent='Completá al menos el nombre y la dirección corta.'; }
          return;
        }
        if(!coords){
          if(msg){ msg.className='form-msg err'; msg.textContent='Necesito coordenadas válidas (o un link de Maps) para poder calcular distancias y usarlo como origen en Maps.'; }
          return;
        }
        var submitBtn = pf.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.disabled = true;
        try{
          await savePuntoInicio(data);
        }catch(e){
          console.warn('savePuntoInicio failed', e);
          if(submitBtn) submitBtn.disabled = false;
          if(msg){ msg.className='form-msg err'; msg.textContent=describeError(e); }
          return;
        }
        editingPuntoInicio=false;
        try{ hardRender(); }catch(e2){ console.warn('render after savePuntoInicio failed', e2); }
        var okMsg = document.getElementById('puntoInicioFormMsg');
        if(okMsg){ okMsg.className='form-msg ok'; okMsg.textContent='Punto de salida guardado ✓'; }
      };
      var piCancel = $('#puntoInicioCancel', root);
      if(piCancel) piCancel.onclick=function(){ editingPuntoInicio=false; hardRender(); };
    }
    $all('[data-act="edit-punto-inicio"]', root).forEach(function(b){
      b.onclick=function(){ editingPuntoInicio=true; hardRender(); };
    });
    $all('[data-act="oc-form-mode"]', root).forEach(function(b){
      b.onclick=function(){ ocFormMode = b.getAttribute('data-mode')==='item' ? 'item' : 'oc'; hardRender(); };
    });
    var of = $('#ocForm', root);
    if(of){
      var formMode = of.getAttribute('data-mode')==='item' ? 'item' : 'oc';
      var ofPdfInput = $('#of_pdf', root);
      if(ofPdfInput){
        ofPdfInput.onchange = async function(){
          var file = ofPdfInput.files && ofPdfInput.files[0];
          var status = $('#of_pdf_status', root);
          if(!file) return;
          if(file.type !== 'application/pdf'){
            if(status){ status.className='form-msg err'; status.textContent='Ese archivo no es un PDF.'; }
            return;
          }
          if(status){ status.className='form-msg'; status.textContent='Leyendo el PDF para completar los campos...'; }
          try{
            var text = await extractPdfText(file);
            if(!text || !text.trim()){
              if(status){ status.className='form-msg'; status.textContent='No se pudo leer texto de este PDF (puede ser un escaneo/foto). Completá los campos a mano.'; }
              return;
            }
            var guess = guessOcFieldsFromText(text);
            var filledAny = false;
            function fillIfEmpty(sel, value){
              if(!value) return;
              var el = $(sel, root);
              if(el && !el.value.trim()){ el.value = value; filledAny = true; }
            }
            fillIfEmpty('#of_numero', guess.numero);
            fillIfEmpty('#of_proyecto', guess.proyecto);
            fillIfEmpty('#of_desc', guess.descripcion);
            fillIfEmpty('#of_fecha', guess.fechaPactada);
            // #of_destino es un <select>: solo lo tocamos si el texto leído
            // coincide con un lugar de entrega ya guardado.
            (function(){
              var elDest = $('#of_destino', root);
              if(elDest && !elDest.value && guess.destino){
                var m = matchByName(destinos, guess.destino);
                if(m){ elDest.value = m.id; filledAny = true; }
              }
            })();
            fillIfEmpty('#of_recNombre', guess.receptorNombre);
            fillIfEmpty('#of_recTel', guess.receptorTelefono);
            if(status){
              status.className='form-msg ok';
              status.textContent = filledAny ? 'Completado automáticamente. Revisá los campos antes de guardar.' : 'No se detectaron datos automáticamente en este PDF. Completá los campos a mano.';
            }
          }catch(e){
            console.warn('autofill from pdf failed', e);
            if(status){ status.className='form-msg'; status.textContent='No se pudo leer el PDF automáticamente. Completá los campos a mano.'; }
          }
        };
      }
      of.onsubmit = async function(ev){
        ev.preventDefault();
        var msg = $('#ocFormMsg', root);
        if(msg){ msg.className='form-msg'; msg.textContent=''; }
        var editingForSubmit = ocs.find(function(o){return o.id===editingOcId;});
        var destSel = $('#of_destino',root).value;
        var destinoId = null, destino = '', destinoLat = null, destinoLng = null;
        if(destSel){
          var dObj = destinos.find(function(d){return d.id===destSel;});
          if(dObj){
            destinoId = dObj.id;
            destino = dObj.nombre + (dObj.direccionCorta? (' — '+dObj.direccionCorta) : '');
            destinoLat = (dObj.lat!=null) ? dObj.lat : null;
            destinoLng = (dObj.lng!=null) ? dObj.lng : null;
          }
        } else if(editingForSubmit && editingForSubmit.destino && !editingForSubmit.destinoId){
          // no se eligió nada nuevo: conservamos el texto libre que ya tenía
          // esta OC de antes de que existiera el picklist de destinos.
          destino = editingForSubmit.destino;
        }
        var data = {
          tipo: formMode,
          numero: $('#of_numero',root).value.trim(),
          proyecto: $('#of_proyecto',root).value.trim(),
          storeId: $('#of_store',root).value,
          descripcion: $('#of_desc',root).value.trim(),
          criticidad: $('#of_crit',root).value,
          fechaPactada: $('#of_fecha',root).value,
          condicionEntrega: $('#of_cond',root).value.trim(),
          destinoId: destinoId,
          destino: destino,
          destinoLat: destinoLat,
          destinoLng: destinoLng,
          receptorNombre: $('#of_recNombre',root).value.trim(),
          receptorTelefono: $('#of_recTel',root).value.trim()
        };
        if(formMode==='item'){
          if(!data.descripcion || !data.storeId){
            if(msg){ msg.className='form-msg err'; msg.textContent='Completá al menos la descripción del ítem y la tienda/punto de recolección.'; }
            return;
          }
        } else if(!data.numero || !data.storeId){
          if(msg){ msg.className='form-msg err'; msg.textContent='Completá al menos el número de OC y la tienda.'; }
          return;
        }
        var submitBtn = of.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.disabled = true;
        var pdfInput = $('#of_pdf',root);
        var pdfFile = pdfInput && pdfInput.files && pdfInput.files[0];
        var newId;
        try{
          newId = await saveOc(data);
        }catch(e){
          console.warn('saveOc failed', e);
          if(submitBtn) submitBtn.disabled = false;
          if(msg){ msg.className='form-msg err'; msg.textContent=describeError(e); }
          return;
        }
        // la OC ya quedó guardada; lo que sigue (PDF, redibujo) no cambia eso.
        if(pdfFile && newId && pdfFile.type==='application/pdf' && db){
          if(pdfFile.size > MAX_MEDIA_BYTES){
            alertLikeBanner('La OC se guardó, pero el PDF pesa demasiado (más de 700 KB) y no se pudo adjuntar. Probá comprimirlo o adjuntarlo desde la tarjeta con un archivo más liviano.');
          } else {
            try{
              var pdfB64 = await blobToBase64(pdfFile);
              var pdfMediaId = await saveMedia('pdf', newId, pdfB64, 'application/pdf');
              await db.collection('ocs').doc(newId).update({pdfMediaId:pdfMediaId, pdfUploadedAt:new Date().toISOString()});
            }catch(e2){ console.warn('pdf upload after saveOc failed', e2); /* la OC ya se guardó; el PDF se puede adjuntar luego desde la tarjeta */ }
          }
        }
        editingOcId=null;
        ocFormMode='oc';
        prefillData=null; // ya se usó (o se descartó) el precompletado del artefacto
        try{ hardRender(); }catch(e3){ console.warn('render after saveOc failed', e3); }
        var okMsg = document.getElementById('ocFormMsg');
        if(okMsg){ okMsg.className='form-msg ok'; okMsg.textContent=(formMode==='item'?'Ítem agregado ✓':'OC agregada ✓'); }
      };
      var cancel2 = $('#ocCancel', root);
      if(cancel2) cancel2.onclick=function(){ editingOcId=null; ocFormMode='oc'; hardRender(); };
    }
    bindCardActions(root);
  }

  function wireRuta(root){
    bindCardActions(root);
  }

  function bindCardActions(root){
    $all('[data-act="edit-store"]', root).forEach(function(b){
      b.onclick=function(){ editingStoreId=b.getAttribute('data-id'); view='admin'; hardRender(); $('#storeForm') && $('#storeForm').scrollIntoView({behavior:'smooth', block:'center'}); };
    });
    $all('[data-act="del-store"]', root).forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id');
        var key='store-'+id;
        if(confirming[key]==='confirm'){ delete confirming[key]; deleteStore(id).catch(function(e){ console.warn('deleteStore failed', e); }); }
        else if(confirming[key]!=='deny'){ flashConfirm(key,false); }
      };
    });
    $all('[data-act="edit-destino"]', root).forEach(function(b){
      b.onclick=function(){ editingDestinoId=b.getAttribute('data-id'); view='admin'; hardRender(); $('#destinoForm') && $('#destinoForm').scrollIntoView({behavior:'smooth', block:'center'}); };
    });
    $all('[data-act="del-destino"]', root).forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id');
        var key='destino-'+id;
        if(confirming[key]==='confirm'){ delete confirming[key]; deleteDestino(id).catch(function(e){ console.warn('deleteDestino failed', e); }); }
        else if(confirming[key]!=='deny'){ flashConfirm(key,false); }
      };
    });
    $all('[data-act="store-up"]', root).forEach(function(b){ b.onclick=function(){ swapStoreOrder(b.getAttribute('data-id'), -1).catch(function(e){ console.warn('reorder failed', e); }); }; });
    $all('[data-act="store-down"]', root).forEach(function(b){ b.onclick=function(){ swapStoreOrder(b.getAttribute('data-id'), 1).catch(function(e){ console.warn('reorder failed', e); }); }; });
    $all('[data-act="recalc-orden"]', root).forEach(function(b){
      b.onclick=function(){
        b.disabled = true;
        var prevText = b.textContent;
        b.textContent = 'Calculando...';
        recalcularOrdenPorCercania().then(function(){
          hardRender();
        }).catch(function(e){
          console.warn('recalcularOrdenPorCercania failed', e);
          b.disabled = false;
          b.textContent = prevText;
          alertLikeBanner('No se pudo recalcular el orden: '+(e&&e.message==='sin_punto_inicio'?'configurá primero el punto de salida con coordenadas.':describeError(e)));
        });
      };
    });

    $all('[data-act="edit-oc"]', root).forEach(function(b){
      b.onclick=function(){ editingOcId=b.getAttribute('data-id'); view='admin'; hardRender(); $('#ocForm') && $('#ocForm').scrollIntoView({behavior:'smooth', block:'center'}); };
    });
    $all('[data-act="del-oc"]', root).forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id');
        var key='oc-'+id;
        if(confirming[key]==='confirm'){ delete confirming[key]; deleteOc(id).catch(function(e){ console.warn('deleteOc failed', e); }); }
        else { flashConfirm(key,false); }
      };
    });
    $all('[data-act="oc-recogido"]', root).forEach(function(b){
      b.onclick=function(){ var o=ocs.find(function(x){return x.id===b.getAttribute('data-id');}); if(o) advanceEstado(o,'recogido').catch(function(e){ console.warn('advanceEstado failed', e); }); };
    });
    $all('[data-act="oc-entregado"]', root).forEach(function(b){
      b.onclick=function(){ var o=ocs.find(function(x){return x.id===b.getAttribute('data-id');}); if(o) advanceEstado(o,'entregado').catch(function(e){ console.warn('advanceEstado failed', e); }); };
    });
    $all('[data-act="toggle-notes"]', root).forEach(function(b){
      b.onclick=function(){ var id=b.getAttribute('data-id'); expandedNotes[id]=!expandedNotes[id]; hardRender(); };
    });
    $all('[data-act="toggle-trip"]', root).forEach(function(b){
      b.onclick=function(){ var id=b.getAttribute('data-id'); expandedTrips[id]=!expandedTrips[id]; hardRender(); };
    });
    $all('[data-act="close-trip"]', root).forEach(function(b){
      b.onclick=function(){ confirming['close-trip']='confirm'; hardRender(); };
    });
    $all('[data-act="cancel-close-trip"]', root).forEach(function(b){
      b.onclick=function(){ delete confirming['close-trip']; hardRender(); };
    });
    $all('[data-act="confirm-close-trip"]', root).forEach(function(b){
      b.onclick=function(){
        delete confirming['close-trip'];
        b.disabled = true;
        b.textContent = 'Archivando...';
        closeTrip().then(function(){
          hardRender();
        }).catch(function(e){
          console.warn('closeTrip failed', e);
          hardRender();
          alertLikeBanner('No se pudo cerrar el viaje del todo: '+(e&&e.message?e.message:'error desconocido')+'. Revisá el historial y la lista de OCs.');
        });
      };
    });
    $all('[data-act="add-note"]', root).forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id');
        var ta = document.getElementById('note_txt_'+id);
        if(!ta || !ta.value.trim()) return;
        var o = ocs.find(function(x){return x.id===id;});
        var text = ta.value.trim();
        ta.value='';
        addLogEntry(o, {type:'text', text:text}).catch(function(e){ console.warn('addLogEntry failed', e); });
      };
    });
    $all('[data-act="view-pdf"]', root).forEach(function(b){
      b.onclick=function(){ viewPdf(b.getAttribute('data-media-id'), b); };
    });
    $all('[data-act="pdf-input"]', root).forEach(function(inp){
      inp.onchange = async function(){
        var id = inp.getAttribute('data-id');
        var file = inp.files && inp.files[0];
        var status = document.getElementById('pdf_status_'+id);
        if(!file) return;
        if(file.type !== 'application/pdf'){
          if(status) status.textContent='Ese archivo no es un PDF.';
          return;
        }
        if(!db){ if(status) status.textContent='No se pudo guardar (sin conexión).'; return; }
        if(file.size > MAX_MEDIA_BYTES){
          if(status) status.textContent='El PDF pesa demasiado (más de 700 KB). Probá comprimirlo.';
          return;
        }
        if(status) status.textContent='Guardando PDF...';
        try{
          var pdfB64 = await blobToBase64(file);
          var pdfMediaId = await saveMedia('pdf', id, pdfB64, 'application/pdf');
          await db.collection('ocs').doc(id).update({pdfMediaId:pdfMediaId, pdfUploadedAt:new Date().toISOString()});
          if(status) status.textContent='PDF adjuntado.';
        }catch(e){
          if(status) status.textContent='Error al guardar el PDF.';
        }
      };
    });
    $all('[data-act="voice-start"]', root).forEach(function(b){
      b.onclick=function(){ voiceStart(b.getAttribute('data-id')); };
    });
    $all('[data-act="voice-stop"]', root).forEach(function(b){
      b.onclick=function(){ voiceStop(b.getAttribute('data-id')); };
    });
    $all('[data-act="voice-cancel"]', root).forEach(function(b){
      b.onclick=function(){ voiceCancel(b.getAttribute('data-id')); };
    });
    $all('[data-act="voice-save"]', root).forEach(function(b){
      b.onclick=function(){ voiceSave(b.getAttribute('data-id')); };
    });
    $all('[data-act="voice-discard"]', root).forEach(function(b){
      b.onclick=function(){ voiceDiscard(b.getAttribute('data-id')); };
    });
    $all('[data-act="play-audio-note"]', root).forEach(function(b){
      b.onclick=function(){ playAudioNote(b.closest('.audio-note'), b); };
    });
  }

  async function resolveNames(root){
    // Sin cuentas no hay perfiles que resolver — el nombre ya se guarda
    // directo en cada nota (ver getMyNombre/setMyNombre y el uso de myId
    // en advanceEstado/addLogEntry/closeTrip). Se deja esta función como
    // no-op para no tener que tocar la llamada existente en rebuild().
  }

  // ---------- identidad sin cuenta: nombre guardado en este dispositivo ----------
  function renderNombreBar(){
    var el = document.getElementById('nombreBar');
    if(!el) return;
    if(editingNombre){
      el.innerHTML = '<form id="nombreForm" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">'+
        '<input id="nombreInput" placeholder="Tu nombre" value="'+esc(myNombre||'')+'" style="flex:1; min-width:160px; max-width:240px;">'+
        '<button type="submit" class="btn btn-primary btn-sm">Guardar</button>'+
        (myNombre?'<button type="button" class="btn btn-ghost btn-sm" id="nombreCancel">Cancelar</button>':'')+
      '</form>';
      var f = document.getElementById('nombreForm');
      f.onsubmit = function(ev){
        ev.preventDefault();
        var v = document.getElementById('nombreInput').value.trim();
        if(!v) return;
        setMyNombre(v);
        myId = myNombre;
        editingNombre = false;
        renderNombreBar();
      };
      var c = document.getElementById('nombreCancel');
      if(c) c.onclick = function(){ editingNombre=false; renderNombreBar(); };
    } else {
      el.innerHTML = myNombre ?
        ('Estás como <b>'+esc(myNombre)+'</b> · <button type="button" class="notes-toggle" id="nombreEdit" style="padding:0;">cambiar</button>') :
        ('<button type="button" class="notes-toggle" id="nombreEdit" style="padding:0;">📝 Poné tu nombre (aparece en tus notas)</button>');
      var e2 = document.getElementById('nombreEdit');
      if(e2) e2.onclick = function(){ editingNombre=true; renderNombreBar(); };
    }
  }

  // ---------- init ----------
  hardRender();
  renderNombreBar();
  boot().then(function(){ hardRender(); renderNombreBar(); return seedIfEmpty(); });
})();
</script>
